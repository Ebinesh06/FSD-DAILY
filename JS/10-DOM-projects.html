<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM PROJECTS</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .subscribe-button{
            border: none;
            background-color: black;
            color: white;
            /* width: 70px; */
            padding: 10px 15px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 60px;
        }
        .is-subscribed{
            background-color: gray;
            color: black;
        }
        .cost-input{
            font-size: 15px;
            padding: 10px;

        }
        .calculate-button{
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <p>
        YouTube subscrcibe button
    </p>
    <button onclick="
    Subscribe();
    " class="js-button subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input type="text" placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="handleCostKeyDown(event);">
    <button onclick="calculateTotal(event);" class="calculate-button">Calculate</button>
    </button>
    <p class="js-total-cost"></p>
    <script>



        function handleCostKeyDown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }
        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value)*100;

            if (cost < 4000) {
                cost = cost + 1000;
            }
            document.querySelector('.js-total-cost').innerHTML = `$${cost/100}`;
        }
        function Subscribe() {
            const buttonElem = document.querySelector('.js-button');
            if (buttonElem.innerText === 'Subscribe') {
                buttonElem.innerHTML = 'Subscribed';
                buttonElem.classList.add('is-subscribed');
            } else {
                buttonElem.innerHTML = 'Subscribe';
                buttonElem.classList.remove('is-subscribed');
            }
        }
    </script>
</body>

</html>
