<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper game</title>
    <link rel="stylesheet" href="10-rock-papper-scissors.css">
</head>

<body>
    <h1>Rock papper scissors game</h1>
    <button onclick="playGame('rock');" class="move-button"><img src="https://supersimple.dev/projects/rock-paper-scissors/images/rock-emoji.png" alt="Rock" class="move-icon"></button>
    <button onclick="playGame('paper');" class="move-button"><img src="https://supersimple.dev/projects/rock-paper-scissors/images/paper-emoji.png" alt="paper" class="move-icon"></button>
    <button onclick="playGame('scissors');" class="move-button"><img src="https://supersimple.dev/projects/rock-paper-scissors/images/scissors-emoji.png" alt="scissors" class="move-icon"></button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>
    <button onclick="
    
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement();" class="reset-button
    ">reset score</button>
    <script src="10-rock-paper-scissors.js"></script>
</body>

</html>
